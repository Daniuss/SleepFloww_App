<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .eyebrow { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 6px; fill: #e7c17a; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 700; fill: #f3efe4; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; fill: #b9b8d6; }
      .stepnum { font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #e7c17a; }
      .steptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 33px; font-weight: 700; fill: #f3efe4; }
      .stepdesc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; fill: #a9a8c6; }
      .footer { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #7c7ba0; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#12162b" />

  <!-- ambient stars -->
  <g fill="#f3efe4">
    <circle cx="90" cy="60" r="1.6" opacity="0.55" />
    <circle cx="150" cy="130" r="1.2" opacity="0.4" />
    <circle cx="70" cy="190" r="1.8" opacity="0.5" />
    <circle cx="1080" cy="80" r="1.6" opacity="0.5" />
    <circle cx="1000" cy="150" r="1.2" opacity="0.4" />
    <circle cx="1120" cy="200" r="1.8" opacity="0.45" />
    <circle cx="1050" cy="260" r="1.2" opacity="0.35" />
    <circle cx="960" cy="70" r="1.3" opacity="0.4" />
    <circle cx="40" cy="320" r="1.3" opacity="0.35" />
    <circle cx="1150" cy="340" r="1.3" opacity="0.35" />
    <circle cx="1100" cy="1120" r="1.4" opacity="0.35" />
    <circle cx="60" cy="1080" r="1.4" opacity="0.35" />
  </g>

  <!-- crescent moon mark -->
  <g transform="translate(1080,72)">
    <path d="M0,-26 A26,26 0 1 0 0,26 A20,20 0 1 1 0,-26 Z" fill="#e7c17a" opacity="0.9" />
  </g>

  <!-- header -->
  <text x="120" y="92" class="eyebrow">SLEEPFLOW</text>
  <text x="118" y="150" class="title">Como o app funciona</text>
  <text x="120" y="192" class="subtitle">Da noite de sono ao relatório, em 5 passos</text>

  <!-- timeline -->
  <line x1="180" y1="270" x2="180" y2="1010" stroke="#e7c17a" stroke-width="3" stroke-linecap="round" opacity="0.55" />

  <!-- Step 1: Login -->
  <g transform="translate(0,300)">
    <circle cx="180" cy="0" r="27" fill="#1b2142" stroke="#e7c17a" stroke-width="3" />
    <text x="180" y="9" text-anchor="middle" class="stepnum">1</text>
    <rect x="260" y="-40" width="80" height="80" rx="18" fill="#1f2547" />
    <g transform="translate(280,-20)" stroke="#f3efe4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="12" r="8" />
      <path d="M6,38 Q6,24 20,24 Q34,24 34,38" />
    </g>
    <text x="364" y="-6" class="steptitle">Login em segundos</text>
    <text x="364" y="30" class="stepdesc">Qualquer e-mail e senha — sem fricção pra começar</text>
  </g>

  <!-- Step 2: Grava a noite -->
  <g transform="translate(0,480)">
    <circle cx="180" cy="0" r="27" fill="#1b2142" stroke="#e7c17a" stroke-width="3" />
    <text x="180" y="9" text-anchor="middle" class="stepnum">2</text>
    <rect x="260" y="-40" width="80" height="80" rx="18" fill="#1f2547" />
    <g transform="translate(280,-22)" stroke="#f3efe4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="0" width="12" height="22" rx="6" />
      <path d="M6,18 Q6,32 20,32 Q34,32 34,18" />
      <line x1="20" y1="32" x2="20" y2="40" />
      <line x1="11" y1="40" x2="29" y2="40" />
    </g>
    <text x="364" y="-6" class="steptitle">Grava a noite</text>
    <text x="364" y="30" class="stepdesc">O microfone escuta enquanto você dorme</text>
  </g>

  <!-- Step 3: Detecta ronco e pausas -->
  <g transform="translate(0,660)">
    <circle cx="180" cy="0" r="27" fill="#1b2142" stroke="#e7c17a" stroke-width="3" />
    <text x="180" y="9" text-anchor="middle" class="stepnum">3</text>
    <rect x="260" y="-40" width="80" height="80" rx="18" fill="#1f2547" />
    <g transform="translate(280,-20)" stroke="#f3efe4" stroke-width="4" stroke-linecap="round">
      <line x1="4" y1="14" x2="4" y2="26" />
      <line x1="13" y1="4" x2="13" y2="36" />
      <line x1="22" y1="10" x2="22" y2="30" />
      <line x1="31" y1="0" x2="31" y2="40" />
      <line x1="40" y1="12" x2="40" y2="28" />
    </g>
    <text x="364" y="-6" class="steptitle">Detecta ronco e pausas</text>
    <text x="364" y="30" class="stepdesc">Uma heurística de volume analisa o áudio</text>
  </g>

  <!-- Step 4: Acompanha o histórico -->
  <g transform="translate(0,840)">
    <circle cx="180" cy="0" r="27" fill="#1b2142" stroke="#e7c17a" stroke-width="3" />
    <text x="180" y="9" text-anchor="middle" class="stepnum">4</text>
    <rect x="260" y="-40" width="80" height="80" rx="18" fill="#1f2547" />
    <g transform="translate(283,-20)" fill="#f3efe4">
      <rect x="0" y="26" width="8" height="12" rx="2" />
      <rect x="13" y="16" width="8" height="22" rx="2" />
      <rect x="26" y="2" width="8" height="36" rx="2" />
    </g>
    <text x="364" y="-6" class="steptitle">Acompanha o histórico</text>
    <text x="364" y="30" class="stepdesc">Eventos, minutos de ronco e severidade por noite</text>
  </g>

  <!-- Step 5: Exporta relatório -->
  <g transform="translate(0,1020)">
    <circle cx="180" cy="0" r="27" fill="#1b2142" stroke="#e7c17a" stroke-width="3" />
    <text x="180" y="9" text-anchor="middle" class="stepnum">5</text>
    <rect x="260" y="-40" width="80" height="80" rx="18" fill="#1f2547" />
    <g transform="translate(286,-22)" stroke="#f3efe4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2,0 H22 L30,8 V40 H2 Z" />
      <path d="M22,0 V8 H30" />
      <line x1="8" y1="18" x2="24" y2="18" stroke-width="2.4" />
      <line x1="8" y1="25" x2="24" y2="25" stroke-width="2.4" />
      <line x1="8" y1="32" x2="18" y2="32" stroke-width="2.4" />
    </g>
    <text x="364" y="-6" class="steptitle">Exporta o relatório</text>
    <text x="364" y="30" class="stepdesc">PDF pronto pra levar ao médico</text>
  </g>

  <line x1="120" y1="1100" x2="1080" y2="1100" stroke="#2a2f52" stroke-width="1.5" />
  <text x="120" y="1140" class="footer">Projeto pessoal — não diagnostica apneia nem substitui avaliação médica</text>
</svg>
